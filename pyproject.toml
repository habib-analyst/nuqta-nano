[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuqta-nano"
version = "0.1.0"
description = "Nuqta-Nano: a tiny from-scratch character-level Transformer (3.4M params) that transliterates Roman Urdu into Urdu script, trained only on the openly licensed Dakshina dataset (CC BY-SA 4.0) with a fully held-out word-level evaluation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
